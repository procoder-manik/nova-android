name: Build Nova APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Nova.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Nova-apk
          path: Nova.apk
      - name: Publish download (latest release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Nova for Android (latest)
          body: |
            Download **Nova.apk** below on your Android phone and install it.
            Build ${{ github.run_number }} · Developed by Manik Hossain (https://manikhossain.in/)
          files: Nova.apk
          make_latest: true
